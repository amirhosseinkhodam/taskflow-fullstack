server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API proxy — only actual API paths (no Angular route conflicts)
    location ~ ^/(auth|projects|tasks|api)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin/Profile API routes — require trailing path to avoid catching Angular /admin and /profile
    location ~ ^/(admin|profile)/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html — never cache (references content-hashed chunks)
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # main.js — never cache (references content-hashed lazy chunks)
    location = /main.js {
        try_files $uri =404;
    }

    # Hashed static assets — cache aggressively (chunk-*.js, chunk-*.css, etc.)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|svg|gif|jpe?g|png|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular SPA — serve static files, fall back to index.html for client routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
